manifest_version = 3
name = __NAME__
description = __DESCRIPTION__
authors = [__AUTHOR__]
language = "javascript"
service_id = __SERVICE_ID__

[scripts]
build = "npm run build"

# Local development order matters:
#   1. `npx @fastly/compute-js-static-publish publish-content --local`
#      writes the publish manifest + assets to `./.static-publisher/kvstore.json`.
#   2. `fastly compute serve` reads that file as the local KV store backing
#      via the binding below — that's how the running Wasm finds the static
#      publisher's settings (otherwise: "Settings not found. You may need to
#      publish your application.").
[local_server]

[local_server.kv_stores]
__KV_STORE_NAME__ = { file = "./.static-publisher/kvstore.json", format = "json" }

[setup]
[setup.kv_stores]
[setup.kv_stores.__KV_STORE_NAME__]
description = "Astro static assets — content, prerendered HTML, and bundled JS/CSS"
